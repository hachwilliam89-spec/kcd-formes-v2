name: Frontend CI

on:
  push:
    branches: [main, develop]
    paths: [frontend-web/**]
  pull_request:
    branches: [main]
    paths: [frontend-web/**]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend-web/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      # Le build n'a PAS besoin des assets (public/sprites/) : ils sont
      # référencés par URL, `next build` réussit sans eux. On valide juste que le
      # bundle compile.
      - name: Build
        run: npm run build
