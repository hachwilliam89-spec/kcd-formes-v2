spring:
  application:
    name: kcd-formes-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/kcdformes}
    username: ${SPRING_DATASOURCE_USERNAME:kcd_user}
    password: ${SPRING_DATASOURCE_PASSWORD:kcd_dev_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

server:
  port: ${SERVER_PORT:8080}

jwt:
  # Défaut de DEV uniquement (en prod, JWT_SECRET est fourni, fort). Doit faire
  # >= 32 caractères (256 bits) : jjwt refuse les clés HMAC-SHA plus courtes.
  secret: ${JWT_SECRET:kcd_dev_secret_key_change_me_at_least_32_chars_long}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

logging:
  level:
    com.kcdformes: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs