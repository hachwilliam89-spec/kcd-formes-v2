; Préréglages d'export (voir docs/CLIENT_GODOT.md §7). Aucun secret ici : le
; keystore de signature Android vient des Paramètres de l'éditeur (debug) ou
; de variables d'environnement GODOT_ANDROID_KEYSTORE_* (release, CI).
; *.json inclus : décor et vague du banc exportés du web (assets/baked/).

[preset.0]

name="Android"
platform="Android"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="*.json"
exclude_filter=""
