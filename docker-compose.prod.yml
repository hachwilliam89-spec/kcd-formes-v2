# Fichier de PRODUCTION autonome (ne dépend pas de docker-compose.yml).
# Prérequis : le proxy mutualisé du VPS (Traefik, stack /opt/edge, dépôt vps-edge)
# doit tourner. Il crée le réseau externe `edge`, tient seul les ports 80/443 et gère
# le HTTPS. Ce projet n'y déclare que ses routes, via les labels ci-dessous (ADR 0002).
# Lancer : docker compose -f docker-compose.prod.yml --env-file .env up -d --build
# Prérequis : les assets du jeu doivent être présents dans
# frontend-web/public/sprites/ AVANT le build (voir scripts/unpack-assets.sh
# et DEPLOY.md) — ils sont gitignorés mais bakés dans l'image du front.
name: kcd-formes

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Pas de port publié : seul le backend (réseau interne) y accède.

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend/Dockerfile
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      SERVER_PORT: 8080
    depends_on:
      postgres:
        condition: service_healthy
    # Pas de port publié : Traefik (réseau edge) route /api et /ws vers backend:8080.
    networks:
      - default
      - edge
    labels:
      - traefik.enable=true
      - traefik.docker.network=edge
      # API REST (/api/v1/...) et WebSocket STOMP du multijoueur (/ws). Le préfixe /api
      # n'est pas retiré : les contrôleurs sont mappés sur /api/v1/...
      - traefik.http.routers.kcd-api.rule=(Host(`kcd-formes.fr`) || Host(`www.kcd-formes.fr`)) && (PathPrefix(`/api/`) || PathPrefix(`/ws`))
      - traefik.http.routers.kcd-api.entrypoints=websecure
      - traefik.http.routers.kcd-api.priority=20
      - traefik.http.services.kcd-api.loadbalancer.server.port=8080

  frontend:
    build:
      context: ./frontend-web
      dockerfile: ../docker/frontend/Dockerfile
      args:
        # Vide = requêtes relatives à l'origine ; nginx route /api vers le backend.
        NEXT_PUBLIC_API_URL: ""
    restart: unless-stopped
    depends_on:
      - backend
    # Pas de port publié : Traefik (réseau edge) route tout le reste vers frontend:3000.
    networks:
      - default
      - edge
    labels:
      - traefik.enable=true
      - traefik.docker.network=edge
      - traefik.http.routers.kcd-web.rule=Host(`kcd-formes.fr`) || Host(`www.kcd-formes.fr`)
      - traefik.http.routers.kcd-web.entrypoints=websecure
      - traefik.http.routers.kcd-web.priority=10
      - traefik.http.services.kcd-web.loadbalancer.server.port=3000

volumes:
  postgres_data:

networks:
  default:
  # Réseau du proxy mutualisé, créé par la stack /opt/edge.
  edge:
    external: true
